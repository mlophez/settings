# Default config for sway
#
# Copy this to ~/.config/sway/config and edit it to your liking.
#
# Read `man 5 sway` for a complete reference.

### Variables
#
# Logo key. Use Mod1 for Alt.
set $mod Mod4

# Home row direction keys, like vim
set $left j
set $down k
set $up l
set $right ntilde

set $shell zsh -i -c
#set $term alacritty --config-file $HOME/.config/alacritty/nord.yml
set $term alacritty
set $wallpaper ~/.config/qtile/wal.jpg
set $lockbg ~/.config/qtile/wal.jpg
# set $term alacritty
# set $wallpaper ~/.local/share/wallpapers/next.png 

# Your preferred application launcher
# Note: pass the final command to swaymsg so that the resulting window can be opened
# on the original workspace that the command was run on.
# set $menu dmenu_path | dmenu | xargs swaymsg exec --
# set $menu wofi --show drun
# set $menu $shell 'menu'
#set $menu $shell 'shell sway-launcher-desktop.sh'

#set $ws1 "1: "
#set $ws2 "2: "
#set $ws3 "3: "
#set $ws4 "4: "
#set $ws5 "5: "
#set $ws6 "6: "
#set $ws7 "7: "
#set $ws8 "8:  "
#set $ws9 "9: "
#set $ws10 "10: "

set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"

### SETTINGS
xwayland enabled
font pango:Fira Code, Bold 14
gaps inner 10
gaps outer 0
workspace_layout default
#workspace_layout tabbed
title_align center
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders none
#titlebar_border_thickness 0
#titlebar_padding 1
#hide_edge_borders smart

