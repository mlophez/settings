# vim: ft=swayconfig

# WAYBAR
bar {
    swaybar_command waybar
}

# MONITORS
exec_always swaycmd monitor

# AUTOSTART
exec swaycmd autostart

# DISTROBOX INIT
exec ~/.config/sway/distrobox.sh

# APPLETs
exec_always nm-applet

# THEME
set $gnome-schema org.gnome.desktop.interface
seat seat0 xcursor_theme Bibata-Modern-Ice
exec_always {
    gsettings set $gnome-schema gtk-theme 'Catppuccin-Mocha-Standard-Peach-Dark'
    gsettings set $gnome-schema color-scheme 'prefer-dark'
    gsettings set $gnome-schema icon-theme 'BeautyLine'
    gsettings set $gnome-schema cursor-theme 'Bibata-Modern-Ice'
    gsettings set $gnome-schema font-name 'Source Code Pro 14'
}
