# vim: ft=swayconfig

exec desktop init

exec_always desktop panel
exec_always desktop monitor

# THEME
set $gnome-schema org.gnome.desktop.interface
seat seat0 xcursor_theme bibata-modern-ice-cursors
exec_always {
    gsettings set $gnome-schema gtk-theme 'Catppuccin-Mocha-Standard-Peach-Dark'
    gsettings set $gnome-schema color-scheme 'prefer-dark'
    gsettings set $gnome-schema icon-theme 'cupertino-sonoma-icons'
    gsettings set $gnome-schema cursor-theme 'bibata-modern-ice-cursors'
    gsettings set $gnome-schema font-name 'JetBrainsMono Nerd Font 14'
}
