env:
  TERMINAL: alacritty
# theme: Dracula
window:
  dimensions:
    columns: 0
    lines: 0
  position:
    x: 0
    y: 0
  padding:
    x: 5
    y: 5
  opacity: 1
  dynamic_padding: false
  startup_mode: Maximized
  title: Alacritty
  dynamic_title: false
  class:
    instance: Alacritty
    general: Alacritty
  gtk_theme_variant: None
scrolling:
  history: 10000
  multiplier: 3
font:
  normal:
    family: JetBrainsMono Nerd Font
    style: Regular
  bold:
    family: JetBrainsMono Nerd Font
    style: Bold
  italic:
    family: JetBrainsMono Nerd Font
    style: Italic
  bold_italic:
    family: JetBrainsMono Nerd Font
    style: Bold Italic
  size: 14.0
  offset:
    x: 0
    y: 0
  glyph_offset:
    x: 0
    y: 0
  AppleFontSmoothing: false
draw_bold_text_with_bright_colors: true
bell:
  animation: EaseOutExpo
  duration: 0
  color: "#ffffff"
selection:
  semantic_escape_chars: ",│`|:\"' ()[]{}<>\t"
  save_to_clipboard: true
cursor:
  style: Underline
  vi_mode_style: None
  unfocused_hollow: true
  thickness: 0.15
live_config_reload: true
shell:
  program: /usr/bin/bash
working_directory: None
winpty_backend: false
mouse:
  double_click: { threshold: 300 }
  triple_click: { threshold: 300 }
  hide_when_typing: false
mouse_bindings:
  - { mouse: Left, action: Copy }
  - { mouse: Middle, action: PasteSelection }
key_bindings:
  - { key: Paste, action: Paste }
  - { key: Copy, action: Copy }
  # Send Ctrl+a with caps
  # - { key: 58, chars: "\x01" }
  # Move with Alt+jklñ
  - { mods: Alt, key: 36, chars: "\e[D" }
  - { mods: Alt, key: 37, chars: "\e[B" }
  - { mods: Alt, key: 38, chars: "\e[A" }
  - { mods: Alt, key: 39, chars: "\e[C" }
  - { mods: Alt, key: 16, chars: "\x03\x04" }
  # Send F6 on Ctrl+Ñ
  - { mods: Control, key: 39, chars: "\x1b[17~" }
debug:
  render_timer: false
  persistent_logging: false
  log_level: Warn
  print_events: false
#import:
#  - ~/.config/alacritty/themes/catppuccin-mocha.yml

colors:
  primary:
    background: "#1E1E2E" # base
    foreground: "#CDD6F4" # text
    # Bright and dim foreground colors
    dim_foreground: "#CDD6F4" # text
    bright_foreground: "#CDD6F4" # text

  # Cursor colors
  cursor:
    text: "#1E1E2E" # base
    cursor: "#F5E0DC" # rosewater
  vi_mode_cursor:
    text: "#1E1E2E" # base
    cursor: "#B4BEFE" # lavender

  # Search colors
  search:
    matches:
      foreground: "#1E1E2E" # base
      background: "#A6ADC8" # subtext0
    focused_match:
      foreground: "#1E1E2E" # base
      background: "#A6E3A1" # green
    footer_bar:
      foreground: "#1E1E2E" # base
      background: "#A6ADC8" # subtext0

  # Keyboard regex hints
  hints:
    start:
      foreground: "#1E1E2E" # base
      background: "#F9E2AF" # yellow
    end:
      foreground: "#1E1E2E" # base
      background: "#A6ADC8" # subtext0

  # Selection colors
  selection:
    text: "#1E1E2E" # base
    background: "#F5E0DC" # rosewater

  # Normal colors
  normal:
    black: "#45475A" # surface1
    red: "#F38BA8" # red
    green: "#A6E3A1" # green
    yellow: "#F9E2AF" # yellow
    blue: "#89B4FA" # blue
    magenta: "#F5C2E7" # pink
    cyan: "#94E2D5" # teal
    white: "#BAC2DE" # subtext1

  # Bright colors
  bright:
    black: "#585B70" # surface2
    red: "#F38BA8" # red
    green: "#A6E3A1" # green
    yellow: "#F9E2AF" # yellow
    blue: "#89B4FA" # blue
    magenta: "#F5C2E7" # pink
    cyan: "#94E2D5" # teal
    white: "#A6ADC8" # subtext0

  # Dim colors
  dim:
    black: "#45475A" # surface1
    red: "#F38BA8" # red
    green: "#A6E3A1" # green
    yellow: "#F9E2AF" # yellow
    blue: "#89B4FA" # blue
    magenta: "#F5C2E7" # pink
    cyan: "#94E2D5" # teal
    white: "#BAC2DE" # subtext1

  indexed_colors:
    - { index: 16, color: "#FAB387" }
    - { index: 17, color: "#F5E0DC" }
