env:
  TERMINAL: alacritty
window:
  dimensions:
    columns: 0
    lines: 0
  position:
    x: 0
    y: 0
  padding:
    x: 5
    y: 5
  opacity: 1
  dynamic_padding: false
  startup_mode: Maximized
  title: Alacritty
  dynamic_title: false
  class:
    instance: Alacritty
    general: Alacritty
  gtk_theme_variant: None
scrolling:
  history: 10000
  multiplier: 3
font:
  normal:
    family: JetBrainsMono Nerd Font
    style: Regular
  bold:
    family: JetBrainsMono Nerd Font
    style: Bold
  italic:
    family: JetBrainsMono Nerd Font
    style: Italic
  bold_italic:
    family: JetBrainsMono Nerd Font
    style: Bold Italic
  size: 14.0
  offset:
    x: 0
    y: 0
  glyph_offset:
    x: 0
    y: 0
  AppleFontSmoothing: false
draw_bold_text_with_bright_colors: true
colors:
  primary:
    background: "#282a36"
    foreground: "#f8f8f2"
    bright_foreground: "#ffffff"
  cursor:
    text: CellBackground
    cursor: CellForeground
  vi_mode_cursor:
    text: CellBackground
    cursr: CellForeground
  search:
    matches:
      foreground: "#44475a"
      background: "#50fa7b"
    focused_match:
      foreground: "#44475a"
      background: "#ffb86c"
    footer_bar:
      background: "#282a36"
      foreground: "#f8f8f2"
  hints:
    start:
      foreground: "#282a36"
      background: "#f1fa8c"
    end:
      foreground: "#f1fa8c"
      background: "#282a36"
  line_indicator:
    foreground: None
    background: None
  selection:
    text: CellForeground
    background: "#44475a"
  normal:
    black: "#21222c"
    red: "#ff5555"
    green: "#50fa7b"
    yellow: "#f1fa8c"
    blue: "#bd93f9"
    magenta: "#ff79c6"
    cyan: "#8be9fd"
    white: "#f8f8f2"
  bright:
    black: "#6272a4"
    red: "#ff6e6e"
    green: "#69ff94"
    yellow: "#ffffa5"
    blue: "#d6acff"
    magenta: "#ff92df"
    cyan: "#a4ffff"
    white: "#ffffff"
bell:
  animation: EaseOutExpo
  duration: 0
  color: "#ffffff"
selection:
  semantic_escape_chars: ",│`|:\"' ()[]{}<>\t"
  save_to_clipboard: true
cursor:
  style: Underline
  vi_mode_style: None
  unfocused_hollow: true
  thickness: 0.15
live_config_reload: true
shell:
  program: /usr/bin/bash
working_directory: None
winpty_backend: false
mouse:
  double_click: { threshold: 300 }
  triple_click: { threshold: 300 }
  hide_when_typing: false
mouse_bindings:
  - { mouse: Left, action: Copy }
  - { mouse: Middle, action: PasteSelection }
key_bindings:
  - { key: Paste, action: Paste }
  - { key: Copy, action: Copy }
  - { key: 58, chars: "\x01" }
  - { key: 36, mods: Alt, chars: "\e[D" }
  - { key: 37, mods: Alt, chars: "\e[B" }
  - { key: 38, mods: Alt, chars: "\e[A" }
  - { key: 39, mods: Alt, chars: "\e[C" }
  - { key: 16, mods: Alt, chars: "\x03\x04" }
debug:
  render_timer: false
  persistent_logging: false
  log_level: Warn
  print_events: false
theme: Dracula
