---
k9s:
  liveViewAutoRefresh: false
  screenDumpDir: /home/mlr/.local/share/state/k9s/screen-dumps
  refreshRate: 2
  maxConnRetry: 5
  readOnly: false
  noExitOnCtrlC: false
  skipLatestRevCheck: false
  disablePodCounting: false
  ui:
    enableMouse: false
    headless: false
    logoless: true
    crumbsless: false
    reactive: false
    noIcons: true
    skin: catppuccin-mocha-transparent
  imageScans:
    enable: false
    exclusions:
      namespaces: []
      labels: {}
  logger:
    tail: 1000
    buffer: 5000
    sinceSeconds: -1
    fullScreen: false
    textWrap: false
    showTime: false
  thresholds:
    cpu:
      warn: 90
      critical: 95
    memory:
      warn: 90
      critical: 95
  featureGates:
    nodeShell: true
  shellPod:
    #image: ubuntu:latest
    image: lgtjpmora/debugger:latest
    namespace: default
    limits:
      memory: 100Mi
      #cpu: 100m
