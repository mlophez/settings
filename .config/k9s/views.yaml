views:
  # Alters the pod view column layout. Uses GVR as key
  v1/pods:
    # Overrides default sort column
    sortColumn: AGE:desc
    columns:
      - PF
      - NAMESPACE
      - NAME
      - READY
      - RESTARTS
      - CPU
      - MEM
      - "%MEM/R"
      - "%MEM/L"
      - IP
      #- NODE
      - STATUS
      - AGE
