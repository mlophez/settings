# $XDG_CONFIG_HOME/k9s/hotkey.yml
hotKey:
  shift-0:
    shortCut: Shift-0
    description: Viewing pods
    command: namespace

  shift-1:
    shortCut: Shift-1
    description: Viewing pods
    command: pods

  shift-2:
    shortCut: Shift-2
    description: View deployments
    command: deployments

  shift-3:
    shortCut: Shift-3
    description: XRay Deployments
    command: xray deployments
