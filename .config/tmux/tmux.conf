#####################
### CONFIGURATION ###
#####################

# PLUGINS
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline true

# SETTINGS
set -g default-command "/usr/bin/zsh"
set -g default-terminal 'xterm-256color'
set -ga terminal-overrides ',*:Tc'

# set -g default-terminal 'screen-256color'
# set -g default-terminal 'tmux-256color'
# set -g default-terminal 'tmux-256color'

# OVERRIDES
## This is for 256 colors

## This is for the cursor shape
# set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

set -g history-limit 10000
set -g allow-rename off
setw -g automatic-rename off
setw -g mode-keys vi
set -g base-index 1
set-option -g renumber-windows on
set-option -sg escape-time 10

unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind 'c'
unbind '"'
unbind '%'

# Move tabs
bind -r > swap-window -t -1 \; previous-window
bind -r < swap-window -t +1 \; next-window

# Buffer mode
bind Space copy-mode

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"

# Windows
bind -n 'M-1' select-window -t 1
bind -n 'M-2' select-window -t 2
bind -n 'M-3' select-window -t 3
bind -n 'M-4' select-window -t 4
bind -n 'M-5' select-window -t 5
bind -n 'M-6' select-window -t 6
bind -n 'M-7' select-window -t 7
bind -n 'M-8' select-window -t 8
bind -n 'M-9' select-window -t 9
bind -n 'M-0' select-window -t 10

bind -n 'M-f' select-window -t +1
bind -n 'M-d' select-window -t -1

# Navigate
bind 'j' select-pane -L
bind 'k' select-pane -D
bind 'l' select-pane -U
bind 'ñ' select-pane -R

bind -n 'C-j' select-pane -L
bind -n 'C-k' select-pane -D
bind -n 'C-l' select-pane -U
bind -n 'C-ñ' select-pane -R

bind -n 'M-h' select-pane -l -Z

bind n new-window 
bind -n  'M-n' new-window 

bind h split-window -h -c '#{pane_current_path}'
bind v split-window -v -c '#{pane_current_path}'
bind y setw synchronize-panes off
bind f resize-pane -Z


# POWERLINE
# source /usr/lib/python3.6/site-packages/powerline/bindings/tmux/powerline.conf
# if-shell 'env "$POWERLINE_CONFIG_COMMAND" tmux setup' '' 'run-shell "powerline-config tmux setup"'
# set -g status-left ''
# set -g status-interval 10

## THEMES
run-shell "~/.config/tmux/themes/nord/nord.tmux"
set -g status-position bottom
set -g status-justify centre
#set -g status-bg default
#set -g status-style bg=default
#set -g window-style bg=default
#set -g window-active-style bg=default

