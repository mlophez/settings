#####################
### CONFIGURATION ###
#####################

set -g default-command "/usr/bin/zsh"
# set -g default-terminal 'screen-256color'
# set -g default-terminal 'tmux-256color'
# set -g default-terminal 'xterm-256color'
set -g default-terminal 'tmux-256color'

# OVERRIDES
## This is for 256 colors
set -ga terminal-overrides ',*:Tc'

## This is for the cursor shape
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# SETTINGS
set -g history-limit 10000
set -g allow-rename off
setw -g automatic-rename off
setw -g mode-keys vi
set -g base-index 1
set-option -g renumber-windows on
set-option -sg escape-time 10

unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind 'c'
unbind '"'
unbind '%'

# Move tabs
bind -r > swap-window -t -1 \; previous-window
bind -r < swap-window -t +1 \; next-window

# Buffer mode
bind Space copy-mode

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded"

# Navigate
bind 'j' select-pane -L
bind 'k' select-pane -D
bind 'l' select-pane -U
bind 'ñ' select-pane -R

bind n new-window 
bind h split-window -h -c '#{pane_current_path}'
bind v split-window -v -c '#{pane_current_path}'
bind y setw synchronize-panes off
bind f resize-pane -Z

######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none


### The modes {

setw -g clock-mode-style 24
setw -g clock-mode-colour colour135
setw -g mode-style fg=colour196,bg=colour238,bold

### }

### The panes {

set -g main-pane-height 30
set -g pane-active-border-style fg='#FF79C6'
#set -g pane-border-style fg=colour238,bg=colour235
#set -g pane-active-border-style fg=colour51,bg=colour236

### }

### The statusbar {

set -g status-position bottom
#set -g status-position top
set -g status-justify left
set -g status-right ''
set -g status-left ''
set -g status-interval 10
set -g status-right-length 100
set -g status-left-length 20
set -g status-style bg=default
#setw -g status-bg default
# set -g status-style bg=colour234,fg=colour137,dim
# set -g status-style bg='#282A36',fg=colour137,dim
# set -g status-right '#[fg=colour255,bg=colour196,bold]    %d-%m-%Y    #[fg=colour255,bg=colour165,bold]    %H:%M    '
# set -g status-right '#[fg=colour233,bg=colour241,bold]    %d-%m-%Y    #[fg=colour233,bg=colour245,bold]    %H:%M    '

setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' *#I:#W '
setw -g window-status-style fg='#E6E6E6',none
setw -g window-status-current-style fg='#BD93F9',bold #blink,underscore
setw -g window-status-bell-style fg=colour255,bg=colour1,bold
# setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
# setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

### }

### The messages {
set -g message-style bg=colour81,fg=colour232,bold

### }

