include ./themes/mocha.conf

font_family JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

tab_bar_edge top
hide_window_decorations yes

window_padding_width 5

shell zsh

cursor_shape beam

map Alt+j     send_key left
map Alt+k     send_key down
map Alt+l     send_key up
map Alt+ñ     send_key right
map Alt+Space send_key F10
map Alt+q quit
map Ctrl+plus  change_font_size all +0.5
map Ctrl+minus change_font_size all -0.5
# kitty --start-as maximized
