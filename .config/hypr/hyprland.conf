# This is an example Hyprland config file.

# Some default env vars.
env = PATH,$PATH:$HOME/.config/hypr
env = WLR_NO_HARDWARE_CURSORS,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland-egl;wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
env = SAL_USE_VCLPLUGIN,kf5
env = ZDOTDIR=,$HOME/.config/zsh
env = BROWSER,org.mozilla.firefox

# Monitors
monitor=eDP-1,1920x1080,0x0,1
monitor=DP-2,preferred,auto,1,mirror,eDP-1
monitor=DP-3,preferred,auto,1,mirror,eDP-1
monitor=DP-4,preferred,auto,1,mirror,eDP-1
monitor=DP-5,preferred,auto,1,mirror,eDP-1
monitor=DP-6,preferred,auto,1,mirror,eDP-1
monitor=DP-7,preferred,auto,1,mirror,eDP-1
monitor=DP-8,preferred,auto,1,mirror,eDP-1
monitor=DP-9,preferred,auto,1,mirror,eDP-1
monitor=HDMI-A-1,preferred,auto,1,mirror,eDP-1
monitor=,disable
#monitor=,preferred,auto,1

# Autostart
exec-once = hyprcmd init
exec-once = deskcmd daemon
exec-once = deskcmd wallpaper
exec = deskcmd panel
exec = deskcmd notify-daemon

general {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more
  gaps_in = 10
  gaps_out = 20
  border_size = 3
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)
  layout = dwindle
  allow_tearing = false
}

debug {
  disable_logs = false
  enable_stdout_logs = true
}

xwayland {
  force_zero_scaling = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
  kb_layout = es
  kb_options = ctrl:nocaps
  kb_model = thinkpad
  follow_mouse = 0
  sensitivity = 0
  # repeat_delay = 300
  # repeat_rate = 50
  touchpad {
    natural_scroll = true
  }
}

cursor {
  no_hardware_cursors = true
}

decoration {
  rounding = 15

  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  shadow {
    range = 30
    render_power = 3
    color = 0x66000000
  }

  blur {
    enabled = true
    size = 2
    passes = 2
    xray = true
    ignore_opacity = true
    special = true
    popups = false
  }
}

animations {
  enabled = true
  animation = windows, 1, 7, default
  animation = windowsOut, 1, 7, default, popin 80%
  animation = layers, 1, 7, default
  animation = fade, 1, 7, default
  animation = border, 1, 7, default
  animation = borderangle, 1, 7, default
  animation = workspaces, 1, 7, default
  animation = specialWorkspace, 1, 7, default, slidefadevert
}

dwindle {
  pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # you probably want this
}

#master {
#  new_is_master = true
#}

gestures {
  workspace_swipe = false
}

misc {
  force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
  focus_on_activate = true
  disable_hyprland_logo = true
  disable_splash_rendering = true
  initial_workspace_tracking = 1
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# device:epic-mouse-v1 {
#   sensitivity = -0.5
# }

# Example windowrule v1
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule = tile,^(Microsoft-edge)$
windowrule = tile,^(Brave-browser)$
windowrule = tile,^(Chromium)$
windowrule = float,^(pavucontrol)$
windowrule = float,^(org.pulseaudio.pavucontrol)$
windowrule = size 70% 70%,^(org.pulseaudio.pavucontrol)$
windowrule = float,^(Emulator)$
windowrule = float,^(blueman-manager)$
windowrule = float,^(nm-connection-editor)$
windowrule = float,^(xdg-desktop-portal-gtk)$
windowrule = size 70% 70%,^(xdg-desktop-portal-gtk)$
windowrule = float,^(nwg-look)$
windowrule = size 70% 70%,^(nwg-look)$

windowrulev2 = tile, initialTitle:(Microsoft Teams)
windowrulev2 = center, floating:1
#windowrulev2 = animation slide,floating:1

# No border when only one
windowrulev2 = noborder, onworkspace:w[t1], floating:0
# windowrulev2 = noborder, focus:0

layerrule = animation slide, notifications
layerrule = animation slide, rofi

# workspace = special:terminal,float

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = super, q, killactive
bind = super, space, togglefloating
bind = super, t, togglegroup
bind = super, f, fullscreen
bind = super, p, pin
bind = super, n, exec, deskcmd menu
bind = super, m, exec, deskcmd terminal toggle
bind = super, w, exec, deskcmd wallpaper
bind = super, RETURN, exec, deskcmd terminal toggle
# bind = super, RETURN, exec, deskcmd terminal
bind = super, o, exec, deskcmd monitor_menu
bind = super, z, exec, deskcmd lock
bind = super, i, exec, makoctl dismiss

bind = super_shift, RETURN, exec, foot
bind = super_shift, e, exec, deskcmd menu exit
bind = super_shift, p, exec, hyprpicker -f hex -n -a
bind = super_shift, r, exec, hyprctl reload
bind = super_shift, x, exec, hyprctl kill

# bind = alt, space, exec, deskcmd terminal toggle

# Keys
# binde = Alt,j,exec,wtype -P left
# binde = Alt,k,exec,wtype -P down
# binde = Alt,l,exec,wtype -P up
# binde = Alt,ntilde,exec,wtype -P right

# Audio
#bind = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
#bind = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioRaiseVolume, exec, deskcmd volume inc
bind = ,XF86AudioLowerVolume, exec, deskcmd volume dec
bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bind = ,XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot
bind = ,Print, exec, deskcmd screenshot


# bind = super, e, exec, echo filemanager
# bind = super_shift, r, exec, reload

# dwindle
#bind = super, p, pseudo
#bind = super, j, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = super, left, movefocus, l
bind = super, right, movefocus, r
bind = super, up, movefocus, u
bind = super, down, movefocus, d

bind = super, j, movefocus, l
bind = super, ntilde, movefocus, r
bind = super, l, movefocus, u
bind = super, k, movefocus, d

#bind = super, j, movewindoworgroup, l
#bind = super, ntilde, movewindoworgroup, r
#bind = super, l, movewindoworgroup, u
#bind = super, k, movewindoworgroup, d

bind = super_shift, j, movewindow, l
bind = super_shift, ntilde, movewindow, r
bind = super_shift, l, movewindow, u
bind = super_shift, k, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = super, 1, workspace, 1
bind = super, 2, workspace, 2
bind = super, 3, workspace, 3
bind = super, 4, workspace, 4
bind = super, 5, workspace, 5
bind = super, 6, workspace, 6
bind = super, 7, workspace, 7
bind = super, 8, workspace, 8
bind = super, 9, workspace, 9
bind = super, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = super_shift, 1, movetoworkspace, 1
bind = super_shift, 2, movetoworkspace, 2
bind = super_shift, 3, movetoworkspace, 3
bind = super_shift, 4, movetoworkspace, 4
bind = super_shift, 5, movetoworkspace, 5
bind = super_shift, 6, movetoworkspace, 6
bind = super_shift, 7, movetoworkspace, 7
bind = super_shift, 8, movetoworkspace, 8
bind = super_shift, 9, movetoworkspace, 9
bind = super_shift, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = super, mouse:272, movewindow
bindm = super, mouse:273, resizewindow

# Minimize windows using special workspaces
bind = super, s, togglespecialworkspace, magic
bind = super, s, movetoworkspace, +0
bind = super, s, togglespecialworkspace, magic
bind = super, s, movetoworkspace, special:magic
bind = super, s, togglespecialworkspace, magic
