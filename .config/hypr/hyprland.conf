# This is an example Hyprland config file.

# Some default env vars.
env = PATH,$PATH:$HOME/.local/bin
env = WLR_NO_HARDWARE_CURSORS,1
env = XCURSOR_SIZE,24
env = MOZ_ENABLE_WAYLAND,1
env = GDK_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland-egl
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = CLUTTER_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
env = SAL_USE_VCLPLUGIN,kf5
env = ZDOTDIR=,$HOME/.config/zsh
env = BROWSER,org.mozilla.firefox

# Monitors
monitor=eDP-1,1920x1080,0x0,1
monitor=DP-3,preferred,auto,1,mirror,eDP-1
monitor=DP-5,preferred,auto,1,mirror,eDP-1
monitor=DP-6,preferred,auto,1,mirror,eDP-1
monitor=HDMI-A-1,preferred,auto,1,mirror,eDP-1
monitor=,disable
#monitor=,preferred,auto,1

# Autostart
exec-once = ~/.config/hypr/hyprcmd init
exec-once = deskcmd wallpaper
exec-once = deskcmd distrobox start
exec-once = deskcmd resource-monitor
# exec-once = deskcmd wallpaper-timer 300
exec = deskcmd panel
exec = deskcmd notify-daemon

xwayland {
  force_zero_scaling = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
  kb_layout = es
  kb_options = ctrl:nocaps
  kb_model = thinkpad
  follow_mouse = 0
  sensitivity = 0
  # repeat_delay = 300
  # repeat_rate = 50
  touchpad {
    natural_scroll = true
  }
}

general {
  # See https://wiki.hyprland.org/Configuring/Variables/ for more
  gaps_in = 10
  gaps_out = 20
  border_size = 3
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)
  layout = dwindle
  allow_tearing = false
}

decoration {
  rounding = 15
  drop_shadow = true
  shadow_range = 4
  shadow_render_power = 3
  col.shadow = rgba(1a1a1aee)
  blur {
    enabled = true
    size = 3
    passes = 1
    vibrancy = 0.1696
  }
}

animations {
  enabled = true
  bezier = myBezier, 0.05, 0.9, 0.1, 1.05
  animation = windows, 1, 7, myBezier
  animation = windowsOut, 1, 7, default, popin 80%
  animation = border, 1, 10, default
  animation = borderangle, 1, 8, default
  animation = fade, 1, 7, default
  animation = workspaces, 1, 6, default
  animation = specialWorkspace, 1, 6, default, slidefadevert
}

dwindle {
  pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # you probably want this
}

master {
  new_is_master = true
}

gestures {
  workspace_swipe = false
}

misc {
  force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
  focus_on_activate = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
# device:epic-mouse-v1 {
#   sensitivity = -0.5
# }

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# windowrulev2 = tile,class:.*
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,class:^(nwg-look)$
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(org.mozilla.Thunderbird)$
windowrulev2 = float,class:^(xdg-desktop-portal-gtk)$
windowrulev2 = center,class:^(xdg-desktop-portal-gtk)$
# windowrulev2 = size 50% 50%,floating:1
# windowrulev2 = center,floating:1
# scratchpad
#windowrulev2 = float,class:(terminal)
# windowrulev2 = tile,class:^(org.mozilla.Thunderbird)$,initialTitle:^Mozilla Thunderbird$
# windowrulev2 = suppressevent, maximize, class:.*

# workspace = special:terminal,float

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = super, q, killactive
bind = super, space, togglefloating
bind = super, f, fullscreen
bind = super, n, exec, deskcmd menu
bind = super, m, exec, deskcmd terminal toggle
bind = super, w, exec, deskcmd wallpaper
bind = super, RETURN, exec, deskcmd terminal
bind = super, o, exec, deskcmd monitor_menu
bind = super, z, exec, deskcmd lock
bind = super, i, exec, makoctl dismiss

bind = super_shift, RETURN, exec, foot
bind = super_shift, e, exec, deskcmd menu exit
bind = super_shift, p, exec, deskcmd menu power

# bind = alt, space, exec, deskcmd terminal toggle

# Keys
# binde = Alt,j,exec,wtype -P left
# binde = Alt,k,exec,wtype -P down
# binde = Alt,l,exec,wtype -P up
# binde = Alt,ntilde,exec,wtype -P right

# Audio
#bind = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
#bind = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = ,XF86AudioRaiseVolume, exec, deskcmd volume inc
bind = ,XF86AudioLowerVolume, exec, deskcmd volume dec
bind = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bind = ,XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot
bind = ,Print, exec, deskcmd screenshot


# bind = super, e, exec, echo filemanager
# bind = super_shift, r, exec, reload

# dwindle
bind = super, p, pseudo
#bind = super, j, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = super, left, movefocus, l
bind = super, right, movefocus, r
bind = super, up, movefocus, u
bind = super, down, movefocus, d

bind = super, j, movefocus, l
bind = super, ntilde, movefocus, r
bind = super, l, movefocus, u
bind = super, k, movefocus, d

bind = super_shift, j, movewindow, l
bind = super_shift, ntilde, movewindow, r
bind = super_shift, l, movewindow, u
bind = super_shift, k, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = super, 1, workspace, 1
bind = super, 2, workspace, 2
bind = super, 3, workspace, 3
bind = super, 4, workspace, 4
bind = super, 5, workspace, 5
bind = super, 6, workspace, 6
bind = super, 7, workspace, 7
bind = super, 8, workspace, 8
bind = super, 9, workspace, 9
bind = super, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = super_shift, 1, movetoworkspace, 1
bind = super_shift, 2, movetoworkspace, 2
bind = super_shift, 3, movetoworkspace, 3
bind = super_shift, 4, movetoworkspace, 4
bind = super_shift, 5, movetoworkspace, 5
bind = super_shift, 6, movetoworkspace, 6
bind = super_shift, 7, movetoworkspace, 7
bind = super_shift, 8, movetoworkspace, 8
bind = super_shift, 9, movetoworkspace, 9
bind = super_shift, 0, movetoworkspace, 10

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = super, mouse:272, movewindow
bindm = super, mouse:273, resizewindow
