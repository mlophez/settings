# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = "$username $hostname $directory $python $line_break$shell $character"
right_format = "$git_status $git_branch"
# Inserts a blank line between shell prompts
add_newline = true

# Replace the '❯' symbol in the prompt with '➜'
[character] # The name of the module we are configuring is 'character'
success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'
error_symbol = '[➜](bold red)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

[username]
format = "[$user]($style)"
style_user = "bold blue"
show_always = true

[hostname]
ssh_only = false
format = '[$hostname](bold red)'
trim_at = '.companyname.com'
disabled = false

[shell]
disabled = false
format='[$indicator]($style)'
style="bold purple"

[directory]
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 5
truncate_to_repo = false

[python]
format = "[$symbol $virtualenv \\($version\\)]($style)"
symbol = "󰌠"
style = "bold green"

[git_branch]
format = "[$branch $symbol]($style)"
symbol = ""
style = "bold purple"

[git_status]
format = "$staged $deleted $modified $untracked"
style = "bold white"
staged = "[${count} ](bold green)"
deleted = "[${count} ](bold red)"
modified = "[${count} ](bold blue)"
untracked = "[${count} ](bold yellow)"
