plugins:
  #--- Create debug container for selected pod in current namespace
  # See https://kubernetes.io/docs/tasks/debug/debug-application/debug-running-pod/#ephemeral-container
  debug:
    shortCut: Shift-D
    description: Add debug container
    dangerous: true
    scopes:
      - containers
    command: bash
    background: false
    confirm: true
    args:
      - -c
      - "kubectl --kubeconfig=$KUBECONFIG debug -it --context $CONTEXT --profile=netadmin -n=$NAMESPACE $POD --target=$NAME --image=nicolaka/netshoot:v0.13 --share-processes -- bash"

  stern:
    shortCut: Ctrl-Y
    confirm: false
    description: "Logs <Stern>"
    scopes:
      - pods
    command: stern
    background: false
    args:
      - --tail
      - 50
      - $FILTER
      - -n
      - $NAMESPACE
      - --context
      - $CONTEXT

  watch-events:
    shortCut: Shift-E
    confirm: false
    description: Get Events
    scopes:
    - all
    command: sh
    background: false
    args:
    - -c
    - "kubectl events --context $CONTEXT --namespace $NAMESPACE --for $RESOURCE_NAME.$RESOURCE_GROUP/$NAME --watch"

  # Author: Daniel Rubin
  # Get recommendations for CPU/Memory requests and limits using Robusta KRR
  # Requires Prometheus in the Cluster and Robusta KRR (https://github.com/robusta-dev/krr) on your system
  # Open K9s in deployments/daemonsets/statefulsets view, then:
  # Shift-K to get recommendations
  krr:
    shortCut: Shift-K
    description: Get krr
    scopes:
      - deployments
      - daemonsets
      - statefulsets
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - |
        LABELS=$(kubectl get $RESOURCE_NAME $NAME -n $NAMESPACE  --context $CONTEXT  --show-labels | awk '{print $NF}' | awk '{if(NR>1)print}')
        krr simple --cluster $CONTEXT --selector $LABELS
        echo "Press 'q' to exit"
        while : ; do
        read -n 1 k <&1
        if [[ $k = q ]] ; then
        break
        fi
        done

  holmesgpt:
    shortCut: Shift-H
    description: Ask HolmesGPT
    scopes:
      - all
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - |
        export AWS_PROFILE=production
        export AWS_BEDROCK_MODEL="bedrock/eu.anthropic.claude-opus-4-6-v1"
        # Check if we're already using the correct context
        CURRENT_CONTEXT=$(kubectl config current-context 2>/dev/null || echo "")
        if [ "$CURRENT_CONTEXT" = "$CONTEXT" ]; then
          # Already using the correct context, run HolmesGPT directly
          holmes ask "why is $NAME of $RESOURCE_NAME in -n $NAMESPACE not working as expected" --model="${AWS_BEDROCK_MODEL}"
        else
          # Create temporary kubeconfig to avoid changing user's system context
          # K9s passes $CONTEXT but we need to ensure HolmesGPT uses the same context
          # without permanently switching the user's kubectl context
          TEMP_KUBECONFIG=$(mktemp)
          kubectl config view --raw > $TEMP_KUBECONFIG
          KUBECONFIG=$TEMP_KUBECONFIG kubectl config use-context $CONTEXT
          # KUBECONFIG environment variable is passed to holmes and all its child processes
          KUBECONFIG=$TEMP_KUBECONFIG holmes ask "why is $NAME of $RESOURCE_NAME in -n $NAMESPACE not working as expected" --model="${AWS_BEDROCK_MODEL}"
          rm -f $TEMP_KUBECONFIG
        fi
        echo "Press 'q' to exit"
        while : ; do
        read -n 1 k <&1
        if [[ $k = q ]] ; then
        break
        fi
        done

  #--- ArgoCD: disparar un sync de la Application seleccionada sin la CLI de argocd.
  # Parchea el campo .operation del CRD Application; el controlador de ArgoCD lo detecta,
  # ejecuta la sincronizacion (con prune) y luego limpia el campo automaticamente.
  argocd-sync:
    shortCut: Shift-S
    description: ArgoCD Sync
    dangerous: true
    scopes:
      - applications
    command: bash
    background: false
    confirm: true
    args:
      - -c
      - |
        # initiatedBy.username es informativo: aparece en el historial de ArgoCD.
        kubectl --kubeconfig=$KUBECONFIG patch application $NAME -n $NAMESPACE --context $CONTEXT --type merge \
          -p '{"operation":{"initiatedBy":{"username":"k9s-miguel"},"sync":{"prune":true,"syncStrategy":{"hook":{}}}}}'
        echo "Sync solicitado para $NAME. Press 'q' to exit"
        while : ; do
        read -n 1 k <&1
        if [[ $k = q ]] ; then
        break
        fi
        done

  #--- ArgoCD: refresh normal (reevalua el estado contra Git sin sincronizar).
  # Anota la Application; ArgoCD procesa la anotacion y la elimina tras reconciliar.
  argocd-refresh:
    shortCut: Shift-R
    description: ArgoCD Refresh
    scopes:
      - applications
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - |
        kubectl --kubeconfig=$KUBECONFIG annotate application $NAME -n $NAMESPACE --context $CONTEXT \
          argocd.argoproj.io/refresh=normal --overwrite
        echo "Refresh (normal) solicitado para $NAME. Press 'q' to exit"
        while : ; do
        read -n 1 k <&1
        if [[ $k = q ]] ; then
        break
        fi
        done

  #--- ArgoCD: hard refresh (ignora la cache del manifiesto y vuelve a leer de la fuente).
  argocd-hard-refresh:
    shortCut: Shift-F
    description: ArgoCD Hard Refresh
    dangerous: true
    scopes:
      - applications
    command: bash
    background: false
    confirm: true
    args:
      - -c
      - |
        kubectl --kubeconfig=$KUBECONFIG annotate application $NAME -n $NAMESPACE --context $CONTEXT \
          argocd.argoproj.io/refresh=hard --overwrite
        echo "Hard refresh solicitado para $NAME. Press 'q' to exit"
        while : ; do
        read -n 1 k <&1
        if [[ $k = q ]] ; then
        break
        fi
        done

