views:
  # Alters the pod view column layout. Uses GVR as key
  v1/pods:
    # Overrides default sort column
    sortColumn: AGE:asc
    columns:
      - PF
      - NAMESPACE
      - NAME
      - READY
      - RESTARTS
      - CPU
      - MEM
      - '%MEM/R'
      - IP
      - STATUS
      - AGE
      - '%CPU/R|H'
      - '%CPU/L|H'
      - '%MEM/L|H'
      - 'NODE|H'
  v1/nodes:
    sortColumn: AGE:asc
    columns:
      - NAME
      - NODEPOOL:.metadata.labels.karpenter\.sh/nodepool
      - TYPE:.metadata.labels.node\.kubernetes\.io/instance-type
      - CAPACITY:.metadata.labels.karpenter\.sh/capacity-type
      - ZONE:.metadata.labels.topology\.kubernetes\.io/zone
      - TAINTS
      - PODS
      - CPU
      - '%CPU'
      - MEM
      - '%MEM'
      - CPU/A|H
      - ROLE|H
      - MEM/A|H
      - GPU/A|H
      - GPU/C|H
      - SH-GPU/A|H
      - SH-GPU/C|H
      - VERSION
      - STATUS
      - AGE
  argoproj.io/v1alpha1/applications:
    sortColumn: NAME:asc
    columns:
      - NAMESPACE
      - NAME
      - BRANCH:.spec.source.targetRevision
      - PULLREQUEST:.metadata.annotations.bot\.gitbot\.io/pull-request
      - SYNC STATUS
      - HEALTH STATUS
      - REVISION
      - PROJECT

