views:
  # Alters the pod view column layout. Uses GVR as key
  v1/pods:
    # Overrides default sort column
    sortColumn: AGE:asc
    columns:
      - PF
      - NAMESPACE
      - NAME
      - READY
      - RESTARTS
      - CPU
      #- CPU/A:.spec.containers[*].resources.requests.cpu
      - '%CPU/R'
      - '%CPU/L|H'
      - MEM
      #- MEM/A:.spec.containers[*].resources.requests.memory
      - '%MEM/R'
      - '%MEM/L|H'
      - IP
      - STATUS
      - AGE
      - 'NODE|H'
      #- CPU_LIM:.spec.containers[*].resources.limits.cpu
      #- MEM_LIM:.spec.containers[*].resources.limits.memory
  v1/nodes:
    sortColumn: AGE:asc
    columns:
      - NAME
      # Fallback: nodepool de Karpenter y, si no, nodegroup de EKS (si no, "-").
      # Los >=2 pipes hacen que k9s evalue el spec como JQ (gojq) en vez de JSONPath,
      # lo que permite el operador de alternativa // para el fallback.
      - 'NODEPOOL:.metadata.labels | .["karpenter.sh/nodepool"] // .["eks.amazonaws.com/nodegroup"] // "-" | tostring'
      - TYPE:.metadata.labels.node\.kubernetes\.io/instance-type
      # Mismo fallback que NODEPOOL: capacity-type de Karpenter y, si no, el de EKS.
      # Normaliza al formato Karpenter: minusculas y _ -> - (EKS usa ON_DEMAND/SPOT).
      - 'CAPACITY:.metadata.labels | (.["karpenter.sh/capacity-type"] // .["eks.amazonaws.com/capacityType"] // "-") | ascii_downcase | gsub("_";"-")'
      - ZONE:.metadata.labels.topology\.kubernetes\.io/zone
      - TAINTS
      - PODS
      - CPU
      - MEM
      - '%CPU'
      - '%MEM'
      - CPU/A|H
      - ROLE|H
      - MEM/A|H
      - GPU/A|H
      - GPU/C|H
      - SH-GPU/A|H
      - SH-GPU/C|H
      - VERSION
      - STATUS
      - AGE
  argoproj.io/v1alpha1/applications:
    sortColumn: NAME:asc
    columns:
      - NAMESPACE
      - PROJECT
      - NAME
      - BRANCH:.spec.source.targetRevision
      - PULLREQUEST:.metadata.annotations.bot\.gitbot\.io/pull-request
      - SYNC STATUS
      - HEALTH STATUS
      - REVISION
  karpenter.sh/v1/nodepool:
    sortColumn: WEIGHT:asc
  apiextensions.k8s.io/v1/customresourcedefinitions:
    sortColumn: GROUP:asc
