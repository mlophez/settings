# Atuin config. Referencia completa: https://docs.atuin.sh/configuration/config/
# La base de datos y la clave de cifrado viven en ~/.local/share/atuin (no versionadas).

## Búsqueda difusa en la TUI (Ctrl-R)
search_mode = "fuzzy"

## Ámbito inicial del filtro: "global", "host", "session" o "directory".
## Dentro de la TUI se rota con Ctrl-R.
filter_mode = "global"

## La TUI se abre inline bajo el prompt en vez de a pantalla completa.
## Atuin no tiene un ajuste de "número de resultados": el límite sale de la altura.
## En estilo compact la UI gasta 2 líneas (buscador + línea de estado),
## así que 12 líneas dejan 10 resultados visibles.
inline_height = 12

## Misma altura cuando Atuin se invoca desde la flecha arriba de la shell
## (por defecto 0, que significa pantalla completa)
inline_height_shell_up_key_binding = 12

## Invierte la TUI: el buscador se dibuja arriba, pegado al prompt, y los
## resultados caen hacia abajo (por defecto el buscador va abajo del todo)
invert = true

## Enter ejecuta el comando directamente; con "return-query" solo lo pega en el prompt
enter_accept = true

## Sync: descomentar tras `atuin register` / `atuin login`
# auto_sync = true
# sync_frequency = "10m"
# sync_address = "https://api.atuin.sh"
