ref: fedora/39/${basearch}/custom
rojig:
  name: fedora-silverblue
  summary: "Fedora Silverblue base image"
  license: MIT
automatic_version_prefix: "39"
mutate-os-release: "39"
repos:
  - fedora-39
  - fedora-39-updates
container-cmd:
  - /usr/bin/bash
selinux: true
documentation: true
boot-location: modules
etc-group-members:
  - wheel
tmp-is-dir: true
ignore-removed-users:
  - root
ignore-removed-groups:
  - root
check-passwd:
  type: file
  filename: passwd
check-groups:
  type: file
  filename: group
default_target: graphical.target
packages:
  - basesystem
  - fedora-release-silverblue
  - fedora-repos-archive
  - fedora-repos-ostree
  # Do not include "full" Git as it brings in Perl
  - git-core
  # Explicitely add Git docs
  - git-core-doc
  - rpm-ostree
  - bootc
  # Required for compatibility with old bootloaders until we have bootupd
  # See https://github.com/fedora-silverblue/issue-tracker/issues/120
  - ostree-grub2
  # Container management
  - podman
  - buildah
  - skopeo
  - toolbox
  - distrobox
  # Provides terminal tools like clear, reset, tput, and tset
